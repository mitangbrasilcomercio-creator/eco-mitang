<!-- login.html - Fragmento da tela de autenticação -->
<div class="h-full w-full flex items-center justify-center animate-fade-in relative z-50 mt-10 lg:mt-20">
    <!-- Painel Glassmorphism -->
    <div class="glass-panel p-8 md:p-10 rounded-2xl w-full max-w-md flex flex-col items-center shadow-[0_8px_32px_rgba(0,0,0,0.3)]">
        
        <!-- Logo -->
        <div class="w-16 h-16 rounded-2xl bg-cyan-500/10 dark:bg-cyan-400/10 border border-cyan-500/20 flex items-center justify-center mb-6 shadow-[0_0_15px_rgba(0,229,255,0.2)]">
            <i class="ph-fill ph-intersect text-4xl text-cyan-500 dark:text-cyan-400"></i>
        </div>
        
        <h2 class="text-2xl font-semibold text-slate-800 dark:text-white mb-1">Acesso Restrito</h2>
        <p class="text-sm text-slate-500 dark:text-slate-400 mb-8 text-center">Ecossistema Mitang - Deep Sea UI</p>

        <!-- Formulário -->
        <form id="form-login" class="w-full space-y-4">
            
            <!-- Input Usuário -->
            <div class="relative group">
                <i class="ph ph-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-cyan-500 dark:group-focus-within:text-cyan-400 transition-colors text-lg"></i>
                <input type="text" id="input-usuario" placeholder="Matrícula ou E-mail" class="search-input w-full rounded-xl py-3 pl-12 pr-4 text-sm focus:outline-none transition-all border border-black/10 dark:border-white/10" required autocomplete="off">
            </div>
            
            <!-- Input Senha -->
            <div class="relative group">
                <i class="ph ph-lock-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-cyan-500 dark:group-focus-within:text-cyan-400 transition-colors text-lg"></i>
                <input type="password" id="input-senha" placeholder="Senha Corporativa" class="search-input w-full rounded-xl py-3 pl-12 pr-4 text-sm focus:outline-none transition-all border border-black/10 dark:border-white/10" required>
            </div>
            
            <!-- Mensagem de Erro -->
            <div id="login-feedback" class="hidden text-xs text-red-500 dark:text-red-400 text-center font-medium bg-red-500/10 border border-red-500/20 py-2 rounded-lg">
                <!-- Injetado via JS -->
            </div>

            <!-- Botão de Login (Glass Button) -->
            <button type="submit" id="btn-submit-login" class="w-full glass-button bg-cyan-500/10 text-cyan-700 dark:text-cyan-400 hover:bg-cyan-500 hover:text-white py-3 rounded-xl font-medium transition-all mt-6 flex items-center justify-center gap-2 group">
                <span id="texto-btn-login">Autenticar Sistema</span>
                <i id="icone-btn-login" class="ph ph-sign-in text-lg group-hover:translate-x-1 transition-transform"></i>
            </button>
        </form>
        
        <p class="text-[10px] text-slate-400 mt-8 text-center uppercase tracking-widest">Acesso Monitorado - Segurança O&G</p>
    </div>
</div>
